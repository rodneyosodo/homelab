services:
  bajeti-backend:
    container_name: bajeti-backend
    image: ghcr.io/rodneyosodo/bajeti/backend:0.3.2
    restart: unless-stopped
    networks:
      - homelab-network
    security_opt:
      - no-new-privileges:true
    ports:
      - 6020:6020
    volumes:
      - ~/docker-volumes/bajeti/db:/app/data
    environment:
      BAJETI_PORT: 6020
      BAJETI_LOG_LEVEL: info
      BAJETI_DB_FILE_NAME: /app/data/bajeti.db
      BAJETI_RECEIPTS_DIR: /app/data/receipts
      BAJETI_FRONTEND_URL: ${BAJETI_FRONTEND_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BAJETI_AI_DEFAULT_PROVIDER: ollama
      BAJETI_AI_OLLAMA_URL: http://ollama:11434
      BAJETI_AI_OLLAMA_MODEL: llama3.2:3b
      BAJETI_BACKUP_DIR: /app/data/backups
      BAJETI_BACKUP_RETENTION_DAYS: 30
      BAJETI_BACKUP_CRON_SCHEDULE: 0 2 * * *
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:6020/healthz/live | grep -qc 'true'",
        ]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 3s

  bajeti-dashboard:
    container_name: bajeti-dashboard
    image: ghcr.io/rodneyosodo/bajeti/dashboard:0.3.2
    restart: unless-stopped
    networks:
      - homelab-network
    security_opt:
      - no-new-privileges:true
    ports:
      - 6021:80
    environment:
      VITE_BETTER_AUTH_URL: ${VITE_BETTER_AUTH_URL}
    depends_on:
      bajeti-backend:
        condition: service_healthy
